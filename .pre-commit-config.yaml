repos:
  - repo: local
    hooks:
      - id: no-commit-to-master
        name: Don't commit to master/main
        entry: scripts/no-commit-to-master.sh
        language: script
        always_run: true
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # - repo: https://github.com/renovatebot/pre-commit-hooks
  #   rev: 38.115.0
  #   hooks:
  #     - id: renovate-config-validator
  # Ruff runs from the project environment, so the version is the one locked
  # in uv.lock (and kept current by Renovate) -- the same one CI uses. A
  # separately pinned ruff-pre-commit drifted to v0.4.2 against a locked 0.16,
  # and the two formatted the same code differently.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --extra dev ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev ruff format
        language: system
        types_or: [python, pyi]
